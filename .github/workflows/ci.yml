name: CI

on:
  push:
  pull_request:

# Nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the running checks obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (a version tag can be moved); the
# comment gives the version that the SHA is.
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: src
      - name: Vet
        run: go vet ./...
      - name: Test (race detector, with coverage)
        run: go test -race -coverpkg=./... -coverprofile=cover.out ./...
      - name: Show the coverage
        run: |
          ../scripts/coverage.sh --profile cover.out --markdown >> "$GITHUB_STEP_SUMMARY"
          ../scripts/coverage.sh --profile cover.out --html coverage.html
      - name: Test the coverage script
        run: COVER_PROFILE="$PWD/cover.out" ../scripts/test-coverage.sh
      - name: Keep the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            src/coverage.html
            src/cover.out
      - name: Build without CGO
        run: CGO_ENABLED=0 go build ./...

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Script logic
        run: npm run test:unit
      - name: Browser tests
        run: npm test
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: e2e/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mw-feed:ci
      - name: Start the container
        run: docker run -d --name mw-feed -p 8080:8080 mw-feed:ci
      - name: Wait for /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs mw-feed
          exit 1
      - name: Health check from inside the container
        run: docker exec mw-feed /mw-feed healthcheck
      - name: The image declares its health check
        run: docker inspect --format '{{.Config.Healthcheck.Test}}' mw-feed:ci | grep healthcheck
      - name: The licence files are shipped
        run: docker cp mw-feed:/licenses - | tar t | grep THIRD_PARTY_LICENSES.md

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history is scanned
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod
      # The binary, pinned by version and checksum (the official action needs a
      # licence for organisations).
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar xzf gitleaks.tar.gz -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Scan the history for secrets
        run: gitleaks git --no-banner --redact
      - name: Test the Git hooks
        run: scripts/test-hooks.sh
